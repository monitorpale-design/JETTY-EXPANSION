<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D MONITORING JETTY EXPANSION</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f4f4f4; padding: 20px; }
        h1 { color: #333; }
        /* Pengaturan zoom maksimal diatur lewat atribut di HTML */
        model-viewer { width: 100%; height: 70vh; background-color: #ffffff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .controls { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; display: inline-block; width: 80%; }
    </style>
</head>
<body>

    <h1>3D MONITORING JETTY EXPANSION</h1>
    
    <model-viewer id="model" src="jetty.glb" alt="Jetty Model" 
                  camera-controls 
                  auto-rotate 
                  shadow-intensity="1"
                  min-camera-orbit="auto auto 0m"
                  max-camera-orbit="auto auto 200%">
    </model-viewer>
    
    <div class="controls">
        <label for="progress"><strong>Construction Progress Timeline:</strong></label><br><br>
        <input type="range" id="progress" min="0" max="1" step="0.01" value="0" style="width: 100%;">
    </div>
    
    <script>
        const model = document.querySelector('#model');
        const slider = document.querySelector('#progress');

        slider.addEventListener('input', () => {
            if (model.duration) {
                model.currentTime = slider.value * model.duration;
            }
        });
    </script>
</body>
</html>
