<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D MONITORING JETTY EXPANSION</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { padding: 10px 0; color: #666; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; }
        
        model-viewer { 
            width: 100%; height: 80vh; 
            background-color: #000;
        }
        .controls { width: 90%; max-width: 600px; margin-top: 15px; }
        input[type=range] { width: 100%; accent-color: #444; }
    </style>
</head>
<body>

    <header>3D MONITORING JETTY EXPANSION</header>
    
    <model-viewer id="model" src="jetty.glb" alt="Jetty Model" 
                  camera-controls 
                  camera-fit
                  shadow-intensity="0"
                  interaction-prompt="none"
                  exposure="1"
                  environment-image="none"> 
    </model-viewer>
    
    <div class="controls">
        <input type="range" id="progress" min="0" max="1" step="0.01" value="0">
    </div>
    
    <script>
        const model = document.querySelector('#model');
        const slider = document.querySelector('#progress');
        slider.addEventListener('input', () => {
            if (model.duration) { model.currentTime = slider.value * model.duration; }
        });
    </script>
</body>
</html>
